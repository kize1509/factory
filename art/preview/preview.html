<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory art preview</title>
<link href="/fonts/fonts.css" rel="stylesheet">
<link href="/md.css" rel="stylesheet">
<script src="/md.js"></script>
<link rel="icon" href="/assets/icon/owl.idle.png">
<style>
  :root { --bg:#f4f7fb; --fg:#14213d; --soft:#52607a; --card:#ffffff; --line:#c9d4e3; --accent:#1d4e89; --accent-fg:#ffffff; --gold:#c49a2c;
          --sky:#8fd0f5; --sea:#1f86c9; --bubble:#ffffff; --think:#3d8fd8; --ok:#4f9a4a; --warn:#d9a21f; --fail:#b8352c; --you:#d6f1fb }
  :root[data-theme="dark"] { --bg:#0b1628; --fg:#e8eef6; --soft:#9fb0cc; --card:#12223a; --line:#2a3d5c; --accent:#e0b84a; --accent-fg:#0b1628; --gold:#e0b84a;
          --sky:#e7907a; --sea:#24508a; --bubble:#162a46; --think:#8fbfe8; --you:#1f3d63 }
  * { box-sizing:border-box }
  html, body { height:100% }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 Inter, system-ui, sans-serif; display:flex; flex-direction:column; overflow:hidden }
  header { position:fixed; top:0; left:0; right:0; z-index:10; display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:8px 16px;
           background:color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:6px solid transparent;
           border-image:repeating-linear-gradient(90deg, var(--accent) 0 6px, transparent 6px 8px, var(--accent) 8px 10px, transparent 10px 12px) 0 0 6 0 }
  header h1 { font:15px Silkscreen, monospace; margin:0 10px 0 0 }
  button { font:12px Silkscreen, monospace; background:var(--card); color:var(--fg); border:2px solid var(--accent); padding:5px 9px; cursor:pointer; border-radius:2px }
  button:hover { filter:brightness(1.05) }
  button.on, button.primary { background:var(--accent); color:var(--accent-fg) }
  header { row-gap:6px }
  @media (max-width: 1180px) { header button { font-size:11px; padding:4px 7px } header h1 { font-size:13px } }
  /* modal windows: centred, own scroll area, actions always visible */
  .modal { position:fixed; inset:0; z-index:30; display:grid; place-items:center; padding:16px; background:rgba(11,22,40,.45); backdrop-filter:blur(3px);
           opacity:0; visibility:hidden; transition:opacity .2s ease, visibility 0s linear .2s }
  .modal.open { opacity:1; visibility:visible; transition:opacity .2s ease, visibility 0s }
  .modal .box { width:min(560px, 100%); max-height:min(86vh, 900px); display:flex; flex-direction:column; background:var(--card); border:2px solid var(--accent);
                border-radius:8px; box-shadow:0 20px 60px rgba(11,22,40,.35); transform:translateY(10px) scale(.98); transition:transform .22s ease; overflow:hidden }
  .modal.open .box { transform:none }
  #alerts { position:absolute; right:16px; top:calc(var(--top, 56px) + 10px); z-index:12; display:grid; gap:8px; width:min(520px, calc(100% - 32px)); pointer-events:none }
  #alerts .al { pointer-events:auto; display:flex; gap:10px; align-items:center; background:var(--card); border:2px solid var(--warn); border-left-width:8px; border-radius:6px; padding:9px 12px;
                box-shadow:0 0 0 3px color-mix(in srgb, var(--warn) 35%, transparent), 0 8px 22px rgba(20,33,61,.25); animation:alertin .3s ease }
  #alerts .al.stuck { border-color:var(--fail); box-shadow:0 0 0 3px color-mix(in srgb, var(--fail) 30%, transparent), 0 8px 22px rgba(20,33,61,.25) }
  #alerts .al div { flex:1; min-width:0; font-size:13px } #alerts .al b { font:12px Silkscreen, monospace; display:block }
  #alerts .al .why { color:var(--soft); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical }
  @keyframes alertin { from { transform:translateY(-8px); opacity:0 } }
  #m-guide .brief { max-height:40vh; overflow:auto; white-space:pre-wrap; font:12px/1.5 'JetBrains Mono', monospace; background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:10px 12px; margin:0 }
  #m-guide .why { color:var(--fail); font-size:13px; max-height:35vh; overflow:auto }
  #m-guide .why .md { color:inherit }
  #m-guide .why.plea { color:var(--fg); font-size:14px } #m-guide .why.plea > b { color:var(--fail) }
  #m-guide .why details { margin-top:8px; color:var(--soft) } #m-guide .why details summary { cursor:pointer; font:11px Silkscreen, monospace }
  #m-guide .why .md .code pre, #m-guide .why .md .code pre code { white-space:pre-wrap; overflow-wrap:anywhere }
  .modal.wide .box { width:min(1240px, 100%); height:min(90vh, 1000px); max-height:none }
  .modal .mh { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:2px solid var(--line) }
  .modal .mh b { font:13px Silkscreen, monospace; color:var(--accent) }
  .modal .mh span { color:var(--soft); font-size:13px }
  .modal .mh .x { margin-left:auto }
  .modal .mb { padding:14px 16px; overflow-y:auto; flex:1; display:grid; gap:12px; align-content:start }
  .modal .mf { display:flex; gap:10px; align-items:center; padding:12px 16px; border-top:2px solid var(--line); background:var(--bg) }
  .modal iframe { border:0; width:100%; height:100%; flex:1; background:var(--bg) }
  .modal label { display:grid; gap:4px; font-size:12.5px; color:var(--soft) }
  .modal label b { color:var(--fg); font-weight:600 }
  .modal input, .modal textarea, .modal select { font:14px Inter, sans-serif; color:var(--fg); background:var(--bg); border:2px solid var(--line); border-radius:4px; padding:8px 10px; width:100% }
  .modal input:focus, .modal textarea:focus, .modal select:focus { outline:none; border-color:var(--accent) }
  .modal details { border:2px solid var(--line); border-radius:4px; padding:8px 10px }
  .modal details summary { cursor:pointer; font:11px Silkscreen, monospace; color:var(--soft) }
  .modal details[open] summary { margin-bottom:10px }
  .modal .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px }
  .modal .err { color:var(--fail); font-size:13px }
  @media (max-width: 560px) { .modal .row2 { grid-template-columns:1fr } }
  .fsb { border:2px solid var(--line); border-radius:4px; overflow:hidden; display:grid }
  .fsb .recent { display:flex; flex-wrap:wrap; gap:6px; padding:8px 10px; border-bottom:1px solid var(--line) }
  .fsb .recent:empty { display:none }
  .fsb .recent button { font:12px Inter, sans-serif; border-width:1px; padding:3px 8px }
  .fsb .crumbs { display:flex; flex-wrap:wrap; align-items:center; gap:2px; padding:6px 10px; background:var(--bg); border-bottom:1px solid var(--line); font:12px 'JetBrains Mono', monospace; color:var(--soft) }
  .fsb .crumbs button { font:inherit; border:0; background:none; padding:2px 4px; color:var(--accent) }
  .fsb .crumbs button:hover { text-decoration:underline }
  .fsb .list { max-height:230px; overflow-y:auto }
  .fsb .row { display:flex; align-items:center; gap:8px; width:100%; text-align:left; font:13px Inter, sans-serif; color:var(--fg); background:none; border:0; border-bottom:1px solid var(--line); border-radius:0; padding:6px 10px }
  .fsb .row:last-child { border-bottom:0 }
  .fsb .row:hover, .fsb .row:focus-visible { background:var(--bg); outline:none }
  .fsb .row.sel { background:color-mix(in srgb, var(--accent) 16%, var(--card)) }
  .fsb .row .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .fsb .row .git { font:9px Silkscreen, monospace; color:var(--accent-fg); background:var(--accent); padding:2px 5px; border-radius:2px }
  .fsb .row .in { color:var(--soft); padding:0 4px }
  .fsb .empty { padding:10px; color:var(--soft); font-size:12.5px }
  .fsb .foot { display:flex; align-items:center; gap:10px; padding:6px 10px; border-top:1px solid var(--line); background:var(--bg); font-size:12px; color:var(--soft) }
  .fsb .foot input { width:auto; margin:0 4px 0 0; vertical-align:middle }
  .fsb .foot button { font-size:10px; padding:3px 7px }
  #fs-pick { font-size:12.5px; color:var(--soft) } #fs-pick.ok b { color:var(--ok) } #fs-pick.bad { color:var(--fail) }
  #scene-view { position:fixed; inset:0; overflow:hidden }
  #left { position:absolute; inset:0 }
  #stage { position:absolute; inset:0; overflow:hidden; cursor:grab; touch-action:none;
           background:var(--sea) }
  #stage.drag { cursor:grabbing }
  #c { position:absolute; inset:0; width:100%; height:100% }
  #ov { position:absolute; inset:0; pointer-events:none }
  .hud { position:absolute; left:12px; top:calc(var(--top, 56px) + 10px); width:min(600px, calc(100% - 24px)); background:var(--card); border:2px solid var(--line); padding:8px 10px; font-size:13px; border-radius:4px; z-index:4; box-shadow:0 4px 14px rgba(20,33,61,.12) }
  .hud .chips { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px }
  .hud .chips button { font-size:11px; padding:4px 7px }
  .hud .chips button.askchip { border-color:var(--warn); color:var(--fg); background:color-mix(in srgb, var(--warn) 35%, var(--card)); animation:askpulse 1.4s ease-in-out infinite }
  .hud .chips button small { font:10px Inter, sans-serif; opacity:.8; margin-left:4px }
  .hud .chips button.fold { margin-left:auto }
  .hud.min .chips { margin-bottom:0 }
  .hud.min .track, .hud.min .line { display:none }
  .hud .track { display:flex; gap:3px; margin:2px 0 6px }
  .hud .track span { flex:1 1 0; min-width:0; text-align:center; font:9px Silkscreen, monospace; padding:4px 3px; border-radius:2px; background:var(--bg); color:var(--soft); border:1px solid var(--line);
                     white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .hud .track span.done { background:color-mix(in srgb, var(--ok) 25%, var(--card)); color:var(--fg) }
  .hud .track span.now { background:var(--accent); color:var(--accent-fg); border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) }
  .hud .line { font-size:12.5px; color:var(--soft) }
  .hud .chips .stopjob, .hud .chips .deljob { border-color:var(--fail); color:var(--fail) } .hud .chips .stopjob, .hud .chips .deljob { margin-left:auto } .hud .chips .stopjob + .deljob, .hud .chips .stopjob + .fold, .hud .chips .deljob + .fold { margin-left:0 }
  .hud .line b { color:var(--fg); font-weight:600 }
  .citycard { position:absolute; left:0; top:0; width:190px; background:var(--card); border:2px solid var(--accent); border-radius:6px; padding:7px 9px; font-size:12px; cursor:pointer;
              box-shadow:0 6px 16px rgba(20,33,61,.18); transition:transform .15s, opacity .3s; will-change:transform }
  .citycard:hover { border-color:var(--gold); z-index:2 }
  .citycard:not(:hover) .t, .citycard:not(:hover) .bar { display:none }
  /* zoomed out the cities are closer than a card is wide: a name chip, the whole card on hover */
  .citycard.chip { width:var(--cw); padding:3px 5px; border-width:1px; font-size:11px }
  .citycard.chip b { font-size:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .citycard.chip:not(:hover):not(:focus-within) > :not(b) { display:none }
  .citycard.chip:not(:hover):not(:focus-within) .askpill { display:none }
  .citycard.chip:hover, .citycard.chip:focus-within { width:190px; padding:7px 9px; border-width:2px; margin-left:calc((var(--cw) - 190px) / 2); z-index:3 }
  .citycard.chip:hover b, .citycard.chip:focus-within b { font-size:12px; overflow:visible; white-space:normal }
  .countrycard { position:absolute; left:0; top:0; background:var(--card); border:2px solid var(--ink); border-left-width:6px; border-radius:6px; padding:4px 10px; font-size:12px; white-space:nowrap; pointer-events:none;
                 box-shadow:0 4px 12px rgba(20,33,61,.2); will-change:transform }
  .countrycard b { font:13px Silkscreen, monospace; display:block }
  .countrycard.free { opacity:.6 }
  .citycard b { font:12px Silkscreen, monospace; display:block }
  .citycard .t { color:var(--soft) }
  .citycard.ask { border-color:var(--warn); box-shadow:0 0 0 3px color-mix(in srgb, var(--warn) 45%, transparent), 0 6px 16px rgba(20,33,61,.18); animation:askpulse 1.4s ease-in-out infinite }
  .askpill { font:9px Silkscreen, monospace; background:var(--warn); color:#14213d; padding:1px 4px; border-radius:2px; vertical-align:middle }
  @keyframes askpulse { 50% { box-shadow:0 0 0 7px color-mix(in srgb, var(--warn) 15%, transparent), 0 6px 16px rgba(20,33,61,.18) } }
  .citycard.empty { border-style:dashed; border-color:var(--line); cursor:default; opacity:.8 }
  .citycard .del { display:none; margin-top:6px; font:10px Silkscreen, monospace; padding:3px 8px; border:1px solid var(--fail); color:var(--fail); background:var(--card); border-radius:3px; cursor:pointer }
  .citycard:hover .del, .citycard:focus-within .del { display:block } .citycard .del:hover, .citycard .del:focus-visible { background:var(--fail); color:#fff }
  .citycard .bar { display:flex; gap:2px; margin-top:5px }
  .citycard .bar i { flex:1; height:4px; border-radius:1px; background:var(--line) }
  .citycard .bar i.done { background:var(--ok) } .citycard .bar i.now { background:var(--gold) }
  #c, #ov { transition:opacity .22s ease }
  #stage.fade #c, #stage.fade #ov { opacity:0 }
  .legend { position:absolute; left:12px; top:calc(var(--top, 56px) + var(--hud, 100px) + 18px); bottom:calc(var(--bottom, 80px) + 12px); width:330px; max-width:calc(100% - 24px); background:var(--card); border:2px solid var(--line);
            border-radius:3px; display:flex; flex-direction:column; overflow:hidden; cursor:default; z-index:4; box-shadow:8px 0 24px rgba(20,33,61,.15);
            transform:translateX(calc(-100% - 30px)); opacity:0; visibility:hidden;
            transition:transform .38s cubic-bezier(.2,.8,.2,1), opacity .25s ease, visibility 0s linear .38s }
  .legend.open { transform:none; opacity:1; visibility:visible; transition:transform .38s cubic-bezier(.2,.8,.2,1), opacity .25s ease, visibility 0s }
  .pop { position:absolute; left:0; top:0; width:260px; background:var(--card); border:2px solid var(--accent); border-radius:4px; padding:10px 12px 10px;
         box-shadow:0 8px 24px rgba(20,33,61,.2); z-index:3; cursor:default; opacity:0; transform:translateY(6px) scale(.97); transform-origin:top left;
         transition:opacity .2s ease, transform .2s ease; pointer-events:none }
  .pop.open { opacity:1; transform:none; pointer-events:auto }
  .pop b { font:12px Silkscreen, monospace; display:block; margin-bottom:4px; color:var(--accent) }
  .pop p { margin:0 0 6px; font-size:13px }
  .pop .who { font-size:12px; color:var(--soft) }
  .pop.wide { width:340px }
  .pop .note { font:12px/1.5 "JetBrains Mono", monospace; max-height:320px; overflow-y:auto }
  .pop .note i { font-style:normal; color:var(--accent); margin-right:4px }
  .pop .note ul { margin:0 0 2px; padding-left:18px }
  .pop .note .late { margin-top:6px; padding:4px 6px; background:color-mix(in srgb, var(--warn) 25%, var(--card)); border-radius:3px; font:12px Inter, sans-serif }
  .pop a { color:var(--accent) }
  .pop .x { position:absolute; right:6px; top:6px; border:0; background:none; padding:2px 4px; font-size:12px }
  .legend nav { display:flex; gap:4px; padding:8px; border-bottom:2px solid var(--line) }
  .legend nav button { flex:1 }
  .legend nav button.hide { flex:0 0 auto; padding:5px 8px }
  .legend .list { overflow-y:auto; padding:6px 8px 10px }
  .legend .item { display:flex; gap:10px; align-items:center; padding:6px; border-radius:3px; cursor:pointer }
  .legend .item:hover { background:var(--bg) }
  .legend .item .thumb { width:72px; height:64px; flex-shrink:0; display:flex; align-items:center; justify-content:center; overflow:hidden }
  .legend .item canvas { image-rendering:pixelated }
  .legend .item b { font:11px Silkscreen, monospace; display:block }
  .legend .item span { font-size:12.5px; color:var(--soft) }
  .procs, .chron { width:520px; bottom:calc(var(--bottom, 80px) + 84px) } /* clear of Homer in the corner */
  .legend .sum { padding:8px 12px; font-size:12.5px; border-bottom:2px solid var(--line); display:flex; gap:12px; flex-wrap:wrap; align-items:center }
  .legend .sum b { font:11px Silkscreen, monospace }
  .legend .sum .x { margin-left:auto }
  .prow { display:grid; grid-template-columns:22px 1fr auto; gap:2px 8px; padding:6px 8px; border-radius:3px; align-items:center }
  .prow:hover { background:var(--bg) }
  .prow .ic { width:16px; height:16px; image-rendering:pixelated }
  .prow .cmd { font:12px "JetBrains Mono", monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .prow .meta { grid-column:2 / 4; font-size:11.5px; color:var(--soft) }
  .prow .st { font:9px Silkscreen, monospace; padding:2px 5px; border-radius:2px; background:var(--line) }
  .prow .st.running { background:var(--accent); color:var(--accent-fg) }
  .prow .st.failed { background:var(--fail); color:#fff }
  .prow .st.exited { background:color-mix(in srgb, var(--ok) 35%, var(--card)) }
  .prow button { font-size:10px; padding:2px 6px }
  #dprocs .prow { padding:4px 0 }
  #narr { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); width:min(760px, calc(100% - 32px)); z-index:5; display:flex; gap:12px; align-items:center;
          background:var(--card); border:2px solid var(--accent); border-bottom-width:4px; border-radius:8px; padding:8px 14px 8px 8px; box-shadow:0 8px 24px rgba(20,33,61,.2); cursor:pointer;
          transition:left .38s cubic-bezier(.2,.8,.2,1), opacity .3s }
  #drawer.open ~ #narr { left:calc((100% - min(380px, 100%)) / 2); width:min(640px, calc(100% - min(380px, 100%) - 32px)) }
  #narr canvas { width:52px; height:52px; image-rendering:pixelated; flex-shrink:0 }
  #narr .fold { flex-shrink:0; align-self:flex-start; padding:0 6px; font-size:14px; line-height:18px }
  #narr.min { width:auto; padding:4px; left:16px; transform:none; border-radius:50% }
  #drawer.open ~ #narr.min { left:16px; width:auto }
  #narr.min > div, #narr.min .fold { display:none }
  #narr.min canvas { width:44px; height:44px }
  #narr.min.new { animation:askpulse 1.4s ease-in-out 2 }
  #narr .who { font:10px Silkscreen, monospace; color:var(--accent); display:flex; justify-content:space-between; gap:8px }
  #narr .who span { color:var(--soft) }
  #narr .txt { font-size:15px; line-height:1.4; min-height:1.4em; max-height:30vh; overflow-y:auto; overflow-wrap:anywhere }
  .chron .entry { padding:7px 10px; border-left:3px solid var(--line); margin:6px 6px 0; font-size:13.5px; line-height:1.45; overflow-wrap:anywhere }
  .chron .entry.now { border-left-color:var(--gold) }
  .chron .entry.ok { border-left-color:var(--ok) }
  .chron .entry.fail { border-left-color:var(--fail) }
  .chron .entry.ship { border-left-color:var(--accent); background:color-mix(in srgb, var(--accent) 7%, var(--card)) }
  .chron .entry small { display:block; color:var(--soft); font:10px Silkscreen, monospace; margin-bottom:2px }
  .chron .entry .body.clamp { max-height:4.4em; overflow:hidden; -webkit-mask-image:linear-gradient(#000 55%, transparent); mask-image:linear-gradient(#000 55%, transparent) }
  .chron .entry .body:not(.clamp) { max-height:50vh; overflow-y:auto }
  .chron .entry { min-width:0 }
  .chron .entry .more { border:0; background:none; padding:2px 0 0; font:10px Silkscreen, monospace; color:var(--accent); cursor:pointer }
  .chron code, #thoughts code { font:12px "JetBrains Mono", monospace; background:var(--bg); padding:0 4px; border-radius:2px }
  .chron a { color:var(--accent) }
  .legend .group { font:10px Silkscreen, monospace; color:var(--accent); margin:10px 6px 2px }
  .zoom { position:absolute; right:12px; transition:right .38s cubic-bezier(.2,.8,.2,1); bottom:calc(var(--bottom, 80px) + 12px); display:flex; gap:4px; z-index:5 }
  .zoom button { width:34px; padding:5px 0 }
  .zoom button.wide { width:auto; padding:5px 8px }
  .bubble { position:absolute; left:0; top:0; max-width:calc(var(--fs, 13px) * 20); background:#fff; color:#14213d; border:2.5px solid var(--bc, var(--fg));
            display:flex; gap:.45em; align-items:flex-start; font-weight:500; box-shadow:0 2px 0 rgba(20,33,61,.14), 0 6px 14px rgba(20,33,61,.12);
            padding:.45em .75em; font-size:var(--fs, 13px); line-height:1.35; border-radius:9px; letter-spacing:.005em; white-space:normal; transition:opacity .35s; will-change:transform }
  .bubble .tail { position:absolute; left:50%; width:2px; margin-left:-1px; background:var(--bc, var(--fg)); top:100% }
  .bubble .ic { width:calc(var(--fs, 12px) * 1.3); height:calc(var(--fs, 12px) * 1.3); image-rendering:pixelated; flex-shrink:0 }
  .bubble.st-thinking, .bubble.st-interrupted { --bc:var(--think) }
  .bubble.st-tool, .bubble.st-dj { --bc:var(--gold) }
  .bubble.st-failed { --bc:var(--fail) }
  .bubble.st-done { --bc:var(--ok) }
  .bubble.st-waiting, .bubble.st-blocked { --bc:var(--warn) }
  .bubble > span { min-width:0 }
  .bubble.closed > span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .bubble.clickable { pointer-events:auto; cursor:pointer }
  .bubble.open { max-width:min(28em, 80vw) }
  .bubble .md { --fg:#14213d; --soft:#52607a; --bg:#f4f7fb; --card:#fff; --line:#c9d4e3; --accent:#1d4e89; --gold:#c49a2c; max-height:40vh; overflow:auto; font-weight:400; font-style:normal; text-align:left }

<script>
const A = window.ASSETS;

// ---------- images ----------
const imgs = {};
function img(file) { const k = file + (dusk ? '.dusk' : ''); if (!imgs[k]) { imgs[k] = new Image(); imgs[k].src = k + '.png'; } return imgs[k]; }
function sprite(c, id, st, x, y, k = 1, fps = 6, t = 0) {

// ---------- what each moment of a job looks like ----------
const SETUPS = {
  idle:      { desc:'No job is running. The city is quiet and the ship waits at the pier.', label:'No jobs', bldg:{}, agents:[] },

               ['herodotus','library','tool','Reading auth/session.go'], ['thales','library','thinking','Found npm test and e2e'], ['solon','council','waiting','Waiting for research']] },
  plan:      { desc:'The planner writes the plan at the Academy, then walks over to Solon to agree on the team.', label:'Plan', bldg:{academy:'active', council:'active'}, agents:[
               ['aristotle','academy','thinking','Drawing the plan'], ['solon','council','tool','2 builders, 1 executor']], say:[['aristotle','solon',['The plan has two subtasks: retry wrapper, then config.','Then two builders and one executor.','Retry first. Config is a small, spelled out step.']]] },
  symposium: { desc:'Several approaches are tried at once on separate branches, one builder each. The best score wins.', label:'Symposium', bldg:{symposium:'active'}, agents:[
               ['archimedes','symposium','tool','Exp 1: cache layer'], ['euclid','symposium','tool','Exp 2: fix the query'],
               ['hero','symposium','tool','Exp 3: batch writes'], ['plato','academy','waiting','Waiting for scores']] },

  checking:  { desc:'The checks you picked run at the Oracle. White smoke means they are running.', label:'Checks running', bldg:{oracle:'running', workshop:'active'}, agents:[
               ['archimedes','oracle','waiting','Running npm test'], ['euclid','workshop','tool','Tidying retry.go']] },
  failed:    { desc:'A check failed and the smoke turns red. The builder walks over and talks it through with another builder.', label:'Checks failed', bldg:{oracle:'fail', workshop:'active'}, agents:[

const JOB = ['intake','research','plan','human','symposium','build','checking','failed','build','checking','passed','review','build','checking','passed','ship','idle'];

// ---------- processes and pods the agents run ----------
// [agent, kind, name, command, exit code when the moment ends]
const RUNS = {
  research:  [['herodotus','proc','rg','rg -n "timeout" src/auth', 0], ['thales','proc','node','npx jest --listTests', 0]],
  plan:      [['aristotle','proc','git','git log --oneline -20 -- src/auth', 0]],
  symposium: [['archimedes','proc','node','npm test (exp 1)', 0], ['euclid','proc','node','npm test (exp 2)', 1], ['hero','proc','node','node scripts/bench.js (exp 3)', 0]],
  build:     [['archimedes','proc','vite','vite dev --port 41012', 143], ['euclid','proc','tsc','tsc --noEmit --watch', 143]],
  checking:  [['archimedes','proc','node','npm test', 1], ['archimedes','pod','e2e-abc123','npx playwright test (apple container, image factory/web-e2e)', 0], ['euclid','proc','tsc','tsc --noEmit --watch', 143]],
  failed:    [['euclid','proc','tsc','tsc --noEmit --watch', 143], ['euclid','proc','node','npx jest auth/retry.test.ts', 0]],
  passed:    [['archimedes','pod','e2e-abc123','playwright: saving videos to .factory/media', 0]],
  review:    [['diogenes','proc','git','git diff main...factory/ABC-123', 0], ['zeno','proc','rg','rg -n "retry" src/', 0], ['archimedes','proc','vite','vite dev --port 41012', 143]],
  ship:      [['xenophon','proc','git','git push origin factory/ABC-123', 0], ['xenophon','proc','gh','gh pr create --fill', 0]],

function startRuns(k) {
  const now = Date.now();
  for (const p of procs) if (p.status === 'running') { p.status = p.exitCode === 0 ? 'exited' : 'failed'; p.ended = now; }
  for (const [agent, kind, name, cmd, exitCode] of RUNS[k] || [])
    procs.unshift({ agent, kind, name, cmd, exitCode, status:'running', started:now, pid: kind === 'pod' ? 'c-' + Math.random().toString(16).slice(2, 8) : String(20000 + Math.floor(Math.random() * 40000)),
                    cpu:5 + Math.random() * 60, mem:(kind === 'pod' ? 600 : 80) + Math.random() * 300, port:/--port (\d+)/.exec(cmd)?.[1] });

function stopProc(p) { if (p.status !== 'running') return; narrate(`You stopped ${p.name} for ${who[p.agent].Name}. The engine ended its process group and told ${who[p.agent].Name}.`); p.status = 'stopped'; p.ended = Date.now(); p.exitCode = 143; pushThought(p.agent, `You stopped ${p.name} (${p.pid}).`, 'you'); renderProcs(); }

const ago = t => { const s = Math.round((Date.now() - t) / 1000); return s < 60 ? s + 's' : Math.floor(s / 60) + 'm ' + (s % 60) + 's'; };
setInterval(() => {
  for (const j of JOBS) for (const p of running(j === cur ? procs : j.st.procs)) { p.cpu = Math.max(1, Math.min(390, p.cpu + (Math.random() - .5) * 30)); p.mem = Math.max(20, p.mem + (Math.random() - .45) * 20); }
  renderProcs(); if (selected) drawerProcs();
}, 1000);

// ---------- handoffs: the only thing that passes from one phase to the next ----------
const HANDOFFS = {
  research:  { from:'solon (scheduler)', to:'researchers', did:'Read ABC-123 and its two linked tickets.', decisions:[], findings:['Success: login works on a slow 3G profile within 45s'], files:[], open_questions:[], next:'Find where the 30s timeout lives and which checks exist.' },
  plan:      { from:'herodotus (researcher)', to:'planner', did:'Traced the timeout and listed the checks.', decisions:[], findings:['Timeout is inline in src/auth/session.go:42', 'A retry helper exists in net/retry.go', 'Checks: npm test, npm run e2e'], files:['src/auth/session.go', 'net/retry.go'], open_questions:[], next:'Choose between a longer timeout and retry with backoff.' },
  symposium: { missing:'aristotle', from:'aristotle (planner)', to:'builders', did:'Found three workable approaches.', decisions:['Try all three as experiments, one builder each'], findings:['All three touch session.go only'], files:['src/auth/session.go'], open_questions:[], next:'Archimedes: cache layer. Euclid: fix the query. Hero: batch writes.' },
  build:     { from:'plato (planner)', to:'builders', did:'Scored the experiments. Exp 2 won with 0.86.', decisions:['Fix the query and retry with backoff (exp 2)'], findings:['Exp 3 failed npm test, disqualified'], files:['src/auth/session.go', 'net/retry.go'], open_questions:[], next:'Archimedes wraps the session call in withRetry(). Euclid tidies retry.go.' },
  checking:  { from:'archimedes (builder)', to:'oracle', did:'Wrapped the session call in withRetry().', decisions:[], findings:[], files:['src/auth/session.go'], open_questions:[], next:'Run npm test and the e2e login suite.' },
  failed:    { from:'oracle (checks)', to:'archimedes', did:'npm test: 2 of 214 failed.', decisions:[], findings:['auth/retry.test.ts: the mock clock does not advance during backoff'], files:['auth/retry.test.ts'], open_questions:[], next:'Advance the mock clock in the wait, then run the checks again.' },
  passed:    { from:'oracle (checks)', to:'reviewers', did:'All 214 tests and the e2e suite pass.', decisions:[], findings:['e2e video saved: media/oracle/e2e-login-retry.webm'], files:[], open_questions:[], next:'Review the diff.' },
  review:    { from:'archimedes (builder)', to:'reviewers', did:'Checks pass. Ready for review.', decisions:[], findings:[], files:['src/auth/session.go', 'net/retry.go'], open_questions:[], next:'Check for hardcoding, overfitting, edge cases and simplicity.' },
  ship:      { from:'socrates (reviewers)', to:'finalizer', did:'Review passed after one fix: the timeout moved to config.', decisions:['Ship as one PR'], findings:[], files:['src/auth/session.go', 'src/config/auth.ts', 'net/retry.go'], open_questions:[], next:'Humanize the PR text, commit, push, open the PR, move ABC-123 to In Review.' },
};
function sendHandoff(fromAt, toAt, k) {
  fromAt = fromAt || cur.lastAt; if (toAt) cur.lastAt = toAt;
  const note = HANDOFFS[k]; if (!note || !fromAt || !toAt || fromAt === toAt && k !== 'checking') return;
  const a = place[fromAt].front, b = place[toAt].front, now = performance.now();
  scroll = { note, from:fromAt, to:toAt, ax:a.x, ay:a.y - 24, bx:b.x, by:b.y - 24, x:a.x, y:a.y - 24, t0:now, phase:'flying' };
  if (note.missing) {

  f.text.placeholder = ask ? 'e.g. the key is in 1Password under Weather; read it from OPENWEATHER_API_KEY' : 'e.g. the test fails because the parser trims spaces; keep them. Look at parse.go line 40.';
  document.getElementById('gd-go').textContent = ask ? 'Send answer' : 'Carry on';
  document.getElementById('gd-more').style.display = ask ? 'none' : '';
  document.getElementById('gderr').textContent = ''; f.text.value = '';
  openModal('m-guide'); setTimeout(() => f.text.focus(), 50);
  const pre = document.getElementById('gd-brief'); pre.textContent = 'Loading…';
  if (!ask) try { const r = await fetch(`/api/jobs/${encodeURIComponent(j.id)}/context`, { cache:'no-store' }); const c = await r.json(); pre.textContent = c.brief || 'Nothing was written down for this job.'; } catch { pre.textContent = 'The engine is not answering.'; }
}
document.getElementById('gdf').onsubmit = async e => {
  e.preventDefault(); const j = guideJob, text = e.target.text.value.trim(), err = document.getElementById('gderr'); if (!j || !text) return;
  const ask = j.live?.state === 'waiting';
  err.textContent = 'Sending…';
  const r = await fetch(ask ? `/api/agents/${encodeURIComponent(j.id)}/${j.live?.asker || j.live?.lead || BUILDER}/message` : `/api/jobs/${encodeURIComponent(j.id)}/continue`,
    { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify({ text }) }).catch(x => ({ ok:false, text:async () => x.message }));
  if (!r.ok) { err.textContent = await r.text(); return; }
  closeModal('m-guide'); clearAlarm(j);
};

// ---------- modal windows ----------
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal').forEach(m => {
  m.addEventListener('pointerdown', e => { if (e.target === m) closeModal(m.id); });
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = () => closeModal(m.id));
});
addEventListener('keydown', e => {
  const open = document.querySelector('.modal.open');
  if (e.key === 'Escape' && open) { closeModal(open.id); e.stopImmediatePropagation(); return; }
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || open || e.metaKey || e.ctrlKey) return;
  if ((e.key === 'a' || e.key === 'A') && LIVE) openAdmin();
  if ((e.key === 'n' || e.key === 'N') && LIVE) openTask();
}, true);

// ---------- Admin opens over the map ----------
function openAdmin(tab) {
  const f = document.getElementById('admin-frame');
  f.src = '/admin.html?embed=1#' + (tab || 'jobs');
  openModal('m-admin');
}
document.getElementById('admin').onclick = () => LIVE ? openAdmin() : (location.href = '/admin.html');
addEventListener('message', e => {
  if (e.origin !== location.origin) return;
  if (e.data?.openJob) { closeModal('m-admin'); const j = JOBS.find(q => q.id === e.data.openJob); if (j) enterCity(j); }
});

// ---------- New task: an issue ID plus optional notes ----------
async function openTask() {
  const f = document.getElementById('ntf'), saved = (() => { try { return JSON.parse(localStorage.getItem('newtask') || '{}'); } catch { return {}; } })();
  f.reset(); document.getElementById('nterr').textContent = '';
  f.repo.value = saved.repo || ''; f.tests.value = saved.tests || '';
  document.getElementById('fs-pick').textContent = '';
  browseTo(saved.repo ? saved.repo.replace(/\/[^/]+\/?$/, '') : '').then(ok => { if (!ok) browseTo(''); });
  checkRepo();
  f.runtime.innerHTML = [['', 'from Admin → Roles'], ['pi', 'Pi'], ['claude-code', 'Claude Code'], ['codex', 'Codex']].map(([v, n]) => `<option value="${v}">${n}</option>`).join('');
  f.model.innerHTML = [['', 'from Admin → Roles'], ...['anthropic/claude-haiku-5-5', 'anthropic/claude-sonnet-5-5', 'anthropic/claude-opus-5-5', 'openai/gpt-6-luna', 'openai/gpt-6.1-terra', 'openai/gpt-6.1-sol'].map(m => [m, m])].map(([v, n]) => `<option value="${v}">${n}</option>`).join('');
  f.runtime.value = saved.runtime || ''; f.model.value = saved.model || '';
  openModal('m-task'); setTimeout(() => f.issue.focus(), 50);
  try { const st = await (await fetch('/api/admin/status', { cache:'no-store' })).json();
        document.getElementById('yt-note').innerHTML = st.youtrack.url && st.youtrack.token_set ? `The ticket's title and description come from YouTrack (${st.youtrack.url}).`
          : `YouTrack isn't set up, so the notes are the task. <a href="#" id="yt-setup">Set it up in Admin → Connections</a>.`;
        const ln = document.getElementById('yt-setup'); if (ln) ln.onclick = ev => { ev.preventDefault(); closeModal('m-task'); openAdmin('connections'); }; } catch {}
}
document.getElementById('newtask').onclick = openTask;

// ---------- The repository: browse folders like a file dialog ----------
const FS = { path:'', home:'', repo:false };
const fsRepo = () => document.getElementById('ntf').repo;
async function browseTo(path, quiet) {
  let d;
  try {
    const r = await fetch('/api/fs?' + new URLSearchParams({ path:path || '', hidden:document.getElementById('fs-hidden').checked ? '1' : '' }), { cache:'no-store' });
    if (!r.ok) throw new Error(await r.text());
    d = await r.json();
  } catch (e) { if (quiet) return false; document.getElementById('fs-list').innerHTML = `<div class="empty">${escHTML(e.message || e)}</div>`; return false; }
  Object.assign(FS, { path:d.path, home:d.home, repo:d.repo });
  const tilde = p => d.home && (p === d.home || p.startsWith(d.home + '/')) ? '~' + p.slice(d.home.length) : p;
  document.getElementById('fs-recent').innerHTML = d.recent.length
    ? '<span style="font-size:12px;color:var(--soft);align-self:center">Recent</span>' + d.recent.slice(0, 8).map(q => `<button type="button" data-pick="${escHTML(q.path)}" title="${escHTML(q.path)}">${escHTML(q.name)}</button>`).join('') : '';
  // the path as clickable steps, from home when it's inside it
  const inHome = d.home && (d.path === d.home || d.path.startsWith(d.home + '/'));
  const parts = (inHome ? d.path.slice(d.home.length) : d.path).split('/').filter(Boolean);
  let at = inHome ? d.home : '';
  document.getElementById('fs-crumbs').innerHTML = `<button type="button" data-go="${escHTML(inHome ? d.home : '/')}">${inHome ? '~' : '/'}</button>` +
    parts.map((n, i) => { at += '/' + n; return `${i || inHome ? '/' : ''}<button type="button" data-go="${escHTML(at)}">${escHTML(n)}</button>`; }).join('');
  const chosen = fsRepo().value.trim();
  document.getElementById('fs-list').innerHTML = (d.parent ? `<button type="button" class="row" data-go="${escHTML(d.parent)}"><span class="n">..</span></button>` : '') +
    (d.folders.length ? d.folders.map(f => `<button type="button" class="row${f.repo && (f.path === chosen || tilde(f.path) === chosen) ? ' sel' : ''}" ${f.repo ? `data-pick="${escHTML(f.path)}"` : `data-go="${escHTML(f.path)}"`} title="${escHTML(f.path)}">
        <span class="n">${escHTML(f.name)}</span>${f.repo ? `<span class="git">git</span><span class="in" data-go="${escHTML(f.path)}" title="Open the folder">›</span>` : '<span class="in">›</span>'}</button>`).join('')
      : '<div class="empty">No folders here.</div>');
  const here = document.getElementById('fs-here');
  here.hidden = !d.repo; here.dataset.pick = d.path;
  return true;
}
function pickRepo(path) {
  fsRepo().value = path; checkRepo();
  document.querySelectorAll('#fs-list .row').forEach(b => b.classList.toggle('sel', b.dataset.pick === path));
}
// say whether what's in the field is a repo the factory can use
let repoTimer;
async function checkRepo() {
  const v = fsRepo().value.trim(), out = document.getElementById('fs-pick');
  if (!v) { out.className = ''; out.textContent = ''; return; }
  const r = await fetch('/api/fs?' + new URLSearchParams({ path:v }), { cache:'no-store' }).catch(() => null);
  if (fsRepo().value.trim() !== v) return;
  const d = r && r.ok ? await r.json() : null;
  if (!d) { out.className = 'bad'; out.textContent = 'There is no folder at this path.'; }
  else if (!d.repo) { out.className = 'bad'; out.textContent = "This folder isn't a git repository. Pick one marked git."; }
  else { out.className = 'ok'; out.innerHTML = `<b>✓</b> ${escHTML(d.name || projectName(d.path))}, a git repository`; }
}
document.querySelector('#m-task .fsb').addEventListener('click', ev => {
  const go = ev.target.closest('[data-go]'), pick = ev.target.closest('[data-pick]');
  if (go) browseTo(go.dataset.go);
  else if (pick) { pickRepo(pick.dataset.pick); if (pick.closest('#fs-recent')) browseTo(pick.dataset.pick.replace(/\/[^/]+$/, '') || '/'); }
});
document.getElementById('fs-hidden').onchange = () => browseTo(FS.path);
document.getElementById('ntf').repo.addEventListener('input', () => {
  clearTimeout(repoTimer);
  repoTimer = setTimeout(async () => { const v = fsRepo().value.trim(); checkRepo(); if (v.startsWith('/') || v.startsWith('~')) browseTo(v.replace(/\/+$/, '') || '/', true); }, 300);
});
document.getElementById('ntf').onsubmit = async ev => {
  ev.preventDefault();
  const f = new FormData(ev.target), err = document.getElementById('nterr');
  const body = { issue:String(f.get('issue')).trim().toUpperCase(), notes:String(f.get('notes')).trim(), repo:String(f.get('repo')).trim(),
    test_notes:String(f.get('tests')).trim(), tests_allowed:f.get('tests_allowed') === 'on', complexity:f.get('complexity'), model:f.get('model') || undefined, runtime:f.get('runtime') || undefined };
  try { localStorage.setItem('newtask', JSON.stringify({ repo:body.repo, tests:f.get('tests'), model:f.get('model'), runtime:f.get('runtime') })); } catch {}
  err.textContent = 'Starting…';
  const r = await fetch('/api/jobs', { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify(body) });
  if (!r.ok) { err.textContent = await r.text(); return; }
  const { id } = await r.json();
  closeModal('m-task');
  enterCity(addLiveJob({ id, title:body.notes ? body.notes.split('\n')[0] : body.issue, repo:body.repo, state:'starting' }));
};
goLive();
</script>
